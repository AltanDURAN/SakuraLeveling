{% extends "admin/base.html" %}

{% block title %}Builder d'arbre — Sakura Admin{% endblock %}

{% block content %}
<style>
/* ------------------------------------------------------------------ cadre */
/* Le builder s'affranchit de la largeur du conteneur admin : un canevas
   étroit est ce qui gêne le plus pour disposer un arbre. */
.bt-root { --bt-w:min(1880px, calc(100vw - 48px)); width:var(--bt-w); margin-left:calc((100% - var(--bt-w)) / 2);
  display:flex; flex-direction:column; gap:10px; }
.bt-root:fullscreen { width:100vw; margin:0; background:var(--bg); padding:12px; box-sizing:border-box; }
.bt-root:fullscreen .bt-head { display:none; }
.bt-head { display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
.bt-head h1 { margin:0; font-size:1.35rem; }
.bt-head .crumb { font-size:.8rem; color:var(--text-faint); text-decoration:none; }

.bt-bar { display:flex; align-items:center; gap:6px; flex-wrap:wrap;
  background:var(--bg-elev); border:1px solid var(--border); border-radius:var(--radius); padding:6px 8px; }
.bt-sep { width:1px; align-self:stretch; background:var(--border); margin:0 4px; }
.bt-btn { font:inherit; font-size:.82rem; padding:6px 10px; border-radius:8px; cursor:pointer;
  border:1px solid var(--border); background:var(--bg-elev); color:var(--text); white-space:nowrap; }
.bt-btn:hover:not(:disabled) { border-color:var(--border-strong); background:var(--bg-soft); }
.bt-btn:disabled { opacity:.4; cursor:default; }
.bt-btn:focus-visible, .bt-chip:focus-visible, .bt-seg button:focus-visible { outline:2px solid var(--violet); outline-offset:1px; }
.bt-btn.on { background:var(--violet); border-color:var(--violet); color:#fff; }
.bt-btn.danger.on { background:var(--danger); border-color:var(--danger); }
.bt-btn.primary { background:var(--success); border-color:var(--success); color:#fff; }
.bt-btn.primary:hover { filter:brightness(1.05); background:var(--success); }
.bt-seg { display:inline-flex; border:1px solid var(--border); border-radius:9px; overflow:hidden; }
.bt-seg button { font:inherit; font-size:.82rem; padding:6px 12px; border:0; cursor:pointer;
  background:var(--bg-elev); color:var(--text-soft); }
.bt-seg button.on { background:var(--accent); color:#fff; }
.bt-dirty { font-size:.78rem; color:var(--warn); font-weight:600; white-space:nowrap; }
.bt-dirty.clean { color:var(--success); font-weight:500; }
.bt-spacer { flex:1; }

.bt-main { display:grid; grid-template-columns:230px minmax(0,1fr) 330px; gap:10px; min-height:0; flex:none; }
.bt-panel { background:var(--bg-elev); border:1px solid var(--border); border-radius:var(--radius);
  padding:12px; overflow:auto; min-height:0; }
.bt-panel h3 { font-size:.7rem; text-transform:uppercase; letter-spacing:.09em; color:var(--text-faint);
  margin:16px 0 7px; font-weight:600; }
.bt-panel h3:first-child { margin-top:0; }
.bt-hint { font-size:.74rem; color:var(--text-faint); line-height:1.45; margin:3px 0 9px; }

/* ------------------------------------------------------------ palettes */
.bt-pal { display:flex; flex-direction:column; gap:4px; }
.bt-chip { display:flex; align-items:center; gap:8px; font:inherit; font-size:.8rem; text-align:left;
  padding:5px 8px; border-radius:8px; border:1px solid transparent; background:transparent;
  color:var(--text); cursor:pointer; width:100%; }
.bt-chip:hover { background:var(--bg-soft); }
.bt-chip.on { border-color:var(--violet); background:var(--violet-soft); }
.bt-chip svg { flex:0 0 22px; }
.bt-dot { width:12px; height:12px; border-radius:50%; flex:0 0 12px; box-shadow:0 0 0 2px rgba(0,0,0,.08); }

.bt-cov div, .bt-sum div { display:flex; justify-content:space-between; gap:8px; font-size:.78rem; padding:2px 0; }
.bt-cov .zero { color:var(--danger); font-weight:600; }
.bt-cov .grp, .bt-sum .grp { color:var(--text-faint); font-size:.7rem; margin-top:7px; }
.bt-probs { display:flex; flex-direction:column; gap:3px; }
.bt-prob { font-size:.76rem; color:var(--danger); cursor:pointer; padding:3px 6px; border-radius:6px; background:transparent; border:0; text-align:left; font:inherit; }
.bt-prob:hover { background:var(--accent-soft); }
.bt-prob.warn { color:var(--warn); }
.bt-ok { font-size:.78rem; color:var(--success); }

/* ------------------------------------------------------------- canevas */
.bt-stage { position:relative; border-radius:var(--radius); overflow:hidden; background:#110e1a;
  border:1px solid var(--border); min-height:0; }
.bt-stage svg { display:block; width:100%; height:100%; touch-action:none; user-select:none; }
.bt-stage[data-tool="place"] svg { cursor:copy; }
.bt-stage[data-tool="link"] svg { cursor:alias; }
.bt-stage[data-tool="delete"] svg { cursor:not-allowed; }
.bt-stage[data-mode="player"] svg { cursor:pointer; }
.bt-float { position:absolute; display:flex; gap:4px; align-items:center; }
.bt-zoom { right:10px; bottom:10px; background:rgba(20,16,32,.85); border:1px solid #2f2745; border-radius:9px; padding:3px; }
.bt-zoom button { font:inherit; width:30px; height:30px; border-radius:7px; border:0; background:transparent;
  color:#e8e0f4; font-size:1rem; cursor:pointer; }
.bt-zoom button:hover { background:#2c2440; }
.bt-zoom span { color:#b9aed0; font-size:.74rem; min-width:44px; text-align:center; font-variant-numeric:tabular-nums; }
.bt-status { left:10px; bottom:10px; color:#b9aed0; font-size:.74rem; background:rgba(20,16,32,.85);
  border:1px solid #2f2745; border-radius:8px; padding:5px 9px; max-width:calc(100% - 210px);
  display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.bt-status kbd { font:inherit; font-size:.7rem; padding:0 4px; border:1px solid #4a3f64; border-radius:4px; color:#e8e0f4; }
.bt-legend { left:10px; top:10px; background:rgba(20,16,32,.85); border:1px solid #2f2745; border-radius:8px;
  padding:6px 9px; color:#d8cfe8; font-size:.74rem; gap:12px; }
.bt-legend i { display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:5px; vertical-align:-1px; }
.bt-tip { position:absolute; pointer-events:none; z-index:5; max-width:260px; background:#1d1729; color:#ece4f6;
  border:1px solid #3d3256; border-radius:9px; padding:8px 10px; font-size:.76rem; line-height:1.45;
  box-shadow:0 8px 24px rgba(0,0,0,.45); display:none; }
.bt-tip b { color:#fff; }
.bt-tip .muted { color:#a99cc0; }
.bt-tip .bad { color:#ff8a9a; }
.bt-toast { position:absolute; left:50%; bottom:56px; transform:translateX(-50%); background:#2a2140; color:#fff;
  padding:7px 14px; border-radius:9px; font-size:.8rem; border:1px solid #4a3f64; opacity:0;
  transition:opacity .18s; pointer-events:none; z-index:6; }
.bt-toast.show { opacity:1; }
.bt-toast.bad { background:#4a1f2c; border-color:#7a3046; }

/* SVG */
.n-lbl { font-family:var(--font); font-weight:600; fill:#d7cee6; paint-order:stroke; stroke:#110e1a; stroke-width:3px; }
.n-ico { font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif; }
.n-badge { font-family:var(--font); font-weight:700; fill:#fff; }
@keyframes bt-pulse { 0%,100% { stroke-opacity:1; } 50% { stroke-opacity:.45; } }
.st-available .n-body { animation:bt-pulse 1.6s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .st-available .n-body { animation:none; } }

/* ------------------------------------------------------------ inspecteur */
.bt-f { display:block; margin-bottom:9px; }
.bt-f > span { display:block; font-size:.7rem; color:var(--text-faint); margin-bottom:3px; }
.bt-f input[type=text], .bt-f input[type=number], .bt-f textarea, .bt-f select, .bt-in {
  width:100%; box-sizing:border-box; padding:5px 7px; font:inherit; font-size:.82rem;
  border:1px solid var(--border); border-radius:7px; background:var(--bg); color:var(--text); }
.bt-row { display:flex; gap:7px; align-items:flex-end; }
.bt-row > * { flex:1; min-width:0; }
.bt-lv { display:grid; grid-template-columns:repeat(auto-fill, minmax(46px,1fr)); gap:4px; }
.bt-lv label { display:flex; flex-direction:column; font-size:.66rem; color:var(--text-faint); }
.bt-lv input { width:100%; box-sizing:border-box; padding:4px 5px; font:inherit; font-size:.8rem; text-align:center;
  border:1px solid var(--border); border-radius:6px; background:var(--bg); color:var(--text); }
.bt-eff { border:1px solid var(--border); border-radius:9px; padding:8px; margin-bottom:7px; background:var(--bg-soft); }
.bt-eff-h { display:flex; justify-content:space-between; align-items:center; gap:6px; margin-bottom:6px; font-size:.8rem; }
.bt-x { border:0; background:transparent; color:var(--danger); cursor:pointer; font-size:.95rem; padding:2px 6px; border-radius:6px; }
.bt-x:hover { background:var(--accent-soft); }
.bt-mini { font:inherit; font-size:.72rem; padding:3px 7px; border-radius:6px; border:1px solid var(--border);
  background:var(--bg-elev); color:var(--text-soft); cursor:pointer; }
.bt-mini:hover { border-color:var(--border-strong); }
.bt-lk { display:flex; align-items:center; gap:6px; padding:5px 6px; border-radius:7px; font-size:.78rem; cursor:pointer; }
.bt-lk:hover, .bt-lk.hot { background:#fff3c4; }
[data-theme="dark"] .bt-lk:hover, [data-theme="dark"] .bt-lk.hot { background:#4a3d1c; }
.bt-lk .dir { color:var(--violet); font-weight:700; width:16px; text-align:center; }
.bt-lk .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.bt-lk select { font:inherit; font-size:.72rem; padding:2px; border:1px solid var(--border); border-radius:5px; background:var(--bg); color:var(--text); }
.bt-icobtn { display:flex; align-items:center; gap:8px; width:100%; font:inherit; font-size:.8rem; cursor:pointer;
  padding:4px 7px; border:1px solid var(--border); border-radius:7px; background:var(--bg); color:var(--text-soft); }
.bt-icobtn .big { font-size:1.35rem; width:30px; text-align:center; }
.bt-empty { color:var(--text-faint); font-size:.82rem; text-align:center; margin-top:30px; line-height:1.6; }

/* ---------------------------------------------------------------- modale */
.bt-modal { position:fixed; inset:0; background:rgba(15,10,22,.55); display:none; align-items:center;
  justify-content:center; z-index:100; }
.bt-root:fullscreen .bt-modal { position:absolute; }
.bt-modal.open { display:flex; }
.bt-dlg { background:var(--bg-elev); color:var(--text); border:1px solid var(--border); border-radius:var(--radius-lg);
  width:min(640px, 92vw); max-height:84vh; display:flex; flex-direction:column; box-shadow:var(--shadow-lg); }
.bt-dlg header { display:flex; align-items:center; gap:10px; padding:14px 16px 8px; }
.bt-dlg header h2 { font-size:1rem; margin:0; flex:1; }
.bt-dlg .body { padding:4px 16px 16px; overflow:auto; }
.bt-icons { display:grid; grid-template-columns:repeat(auto-fill, minmax(40px,1fr)); gap:4px; }
.bt-icons button { font-size:1.4rem; height:40px; border-radius:8px; border:1px solid transparent; background:transparent; cursor:pointer; }
.bt-icons button:hover { background:var(--bg-soft); border-color:var(--border); }
.bt-icons button.on { border-color:var(--violet); background:var(--violet-soft); }
.bt-igrp { font-size:.72rem; color:var(--text-faint); margin:12px 0 5px; text-transform:uppercase; letter-spacing:.07em; }
.bt-ptable { width:100%; border-collapse:collapse; font-size:.8rem; }
.bt-ptable td { padding:4px 3px; vertical-align:middle; }
.bt-ptable input, .bt-ptable select { width:100%; box-sizing:border-box; font:inherit; font-size:.78rem; padding:4px 5px;
  border:1px solid var(--border); border-radius:6px; background:var(--bg); color:var(--text); }
.bt-ptable input[type=color] { padding:1px; height:28px; }
</style>

<div class="bt-root" id="bt-root">
  <div class="bt-head">
    <a href="/admin" class="crumb">← Admin</a>
    <h1>Builder d'arbre de compétences</h1>
  </div>

  <div class="bt-bar" role="toolbar" aria-label="Outils du builder">
    <div class="bt-seg" role="radiogroup" aria-label="Mode">
      <button data-mode="edit" class="on" role="radio">✏️ Édition</button>
      <button data-mode="player" role="radio">🎮 Vue joueur</button>
    </div>
    <span class="bt-sep"></span>
    <span id="tools-edit" style="display:contents">
      <button class="bt-btn" data-tool="place" title="Poser une case (1)">✚ Poser</button>
      <button class="bt-btn" data-tool="select" title="Sélectionner / déplacer (2)">⬚ Sélection</button>
      <button class="bt-btn" data-tool="link" title="Relier deux cases (3)">⇢ Relier</button>
      <button class="bt-btn danger" data-tool="delete" title="Supprimer au clic ou au rectangle (4)">🗑 Supprimer</button>
      <span class="bt-sep"></span>
    </span>
    <button class="bt-btn" id="b-undo" title="Annuler (Ctrl+Z)">↶</button>
    <button class="bt-btn" id="b-redo" title="Rétablir (Ctrl+Y)">↷</button>
    <span class="bt-sep"></span>
    <button class="bt-btn primary" id="b-save" title="Enregistrer (Ctrl+S)">💾 Enregistrer</button>
    <button class="bt-btn" id="b-reload" title="Recharger depuis le disque">↻</button>
    <span class="bt-dirty clean" id="dirty">✓ enregistré</span>
    <span class="bt-spacer"></span>
    <button class="bt-btn" id="b-palettes" title="Formes, types et liens">🎨 Palettes</button>
    <button class="bt-btn" id="b-full" title="Plein écran (F)">⛶ Plein écran</button>
  </div>

  <div class="bt-main" id="bt-main">
    <aside class="bt-panel" id="side"></aside>

    <div class="bt-stage" id="stage" data-tool="place" data-mode="edit">
      <svg id="cv" aria-label="Canevas de l'arbre">
        <defs>
          <filter id="f-neb" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="42"/></filter>
          <filter id="f-glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5"/></filter>
          <filter id="f-grey"><feColorMatrix type="saturate" values="0"/></filter>
        </defs>
        <g id="world">
          <g id="g-bg"></g><g id="g-links"></g><g id="g-nodes"></g><g id="g-over"></g>
        </g>
      </svg>
      <div class="bt-float bt-legend" id="legend" style="display:none">
        <span><i style="background:#4a4458"></i>Verrouillée</span>
        <span><i style="background:#4aa3ff"></i>Déblocable</span>
        <span><i style="background:#4fc383"></i>Débloquée</span>
        <span><i style="background:#f0c45c"></i>Au maximum</span>
      </div>
      <div class="bt-float bt-status" id="status"></div>
      <div class="bt-float bt-zoom">
        <button id="z-out" title="Dézoomer (−)" aria-label="Dézoomer">−</button>
        <span id="z-val">100 %</span>
        <button id="z-in" title="Zoomer (+)" aria-label="Zoomer">+</button>
        <button id="z-fit" title="Recentrer (0)" aria-label="Recentrer">⤢</button>
      </div>
      <div class="bt-tip" id="tip"></div>
      <div class="bt-toast" id="toast"></div>
    </div>

    <aside class="bt-panel" id="insp"></aside>
  </div>

  <div class="bt-modal" id="modal"><div class="bt-dlg" id="dlg"></div></div>
</div>

<script id="d-tree" type="application/json">{{ tree_json|safe }}</script>
<script id="d-cat" type="application/json">{{ catalogue_json|safe }}</script>
<script id="d-icons" type="application/json">{{ icons_json|safe }}</script>
{% raw %}
<script>
(() => {
// =====================================================================
//  Données et constantes
// =====================================================================
const read = id => JSON.parse(document.getElementById(id).textContent);
const CATALOGUE = read('d-cat');
const ICON_GROUPS = read('d-icons');
const EFFECTS = CATALOGUE.flatMap(g => g.effects.map(e => ({...e, group: g.group})));
const EFFECT = Object.fromEntries(EFFECTS.map(e => [e.type, e]));
const CODE_EFFECTS = new Set(EFFECTS.filter(e => e.unit === 'code').map(e => e.type));
const GEOMETRIES = {circle: 'Cercle', square: 'Carré', hexagon: 'Hexagone', diamond: 'Losange', octagon: 'Octogone'};
const LINK_STYLES = {solid: 'Plein', dashed: 'Tirets', dotted: 'Points'};
const RING = 95, STEP = Math.PI / 12;            // grille polaire : 95 px, 15°
const SIM_KEY = 'sakura-builder-sim';
const STATE_COLORS = {locked: '#4a4458', available: '#4aa3ff', progress: '#4fc383', maxed: '#f0c45c'};

const S = {
  tree: normalize(read('d-tree')),
  undo: [], redo: [], saved: null,
  mode: 'edit', tool: 'place',
  shape: null, ntype: null, ltype: null,
  sel: new Set(), selLink: null,
  hoverNode: null, hoverLink: null, hotLink: null,
  linkFrom: null, cursor: null, drag: null,
  view: {x: 0, y: 0, k: 1},
  sim: loadSim(),
};
S.saved = snapshot();
S.shape = Object.keys(S.tree.shapes)[0];
S.ntype = Object.keys(S.tree.node_types)[0];
S.ltype = Object.keys(S.tree.link_types)[0];

const $ = id => document.getElementById(id);
const svg = $('cv'), world = $('world'), stage = $('stage');

// =====================================================================
//  Modèle
// =====================================================================
function normalize(t) {
  t.nodes = t.nodes || {}; t.links = t.links || []; t.roots = t.roots || [];
  t.shapes = t.shapes || {}; t.node_types = t.node_types || {}; t.link_types = t.link_types || {};
  for (const n of Object.values(t.nodes)) {
    n.name ??= ''; n.description ??= ''; n.icon ??= '';
    n.max_level = Math.max(1, parseInt(n.max_level || 1, 10));
    n.costs = fit(n.costs || [], n.max_level, 1);
    n.effects = (n.effects || []).map(e => ({type: e.type, values: fit(e.values || [], n.max_level, 0)}));
    n.position = n.position || {x: 0, y: 0};
    n.unlock_rule = n.unlock_rule === 'any' ? 'any' : 'all';
    n.start = !!n.start;
  }
  t.links = t.links.filter(l => t.nodes[l.from] && t.nodes[l.to]);
  t.roots = Object.entries(t.nodes).filter(([, n]) => n.start).map(([c]) => c);
  return t;
}
function fit(arr, len, dflt) {
  const out = arr.slice(0, len);
  while (out.length < len) out.push(out.length ? out[out.length - 1] : dflt);
  return out;
}
function snapshot() { return JSON.stringify(S.tree); }
function N(c) { return S.tree.nodes[c]; }
function incoming(c) { return S.tree.links.filter(l => l.to === c); }
function outgoing(c) { return S.tree.links.filter(l => l.from === c); }

/** Toute modification passe par ici : historique, état « non enregistré », rendu. */
function mutate(fn, {inspector = true} = {}) {
  const before = snapshot();
  fn();
  S.tree.roots = Object.entries(S.tree.nodes).filter(([, n]) => n.start).map(([c]) => c);
  if (snapshot() !== before) {
    S.undo.push(before);
    if (S.undo.length > 300) S.undo.shift();
    S.redo = [];
  }
  render({inspector});
}
function undo() {
  if (!S.undo.length) return toast('Rien à annuler');
  S.redo.push(snapshot());
  S.tree = normalize(JSON.parse(S.undo.pop()));
  pruneSelection(); render(); toast('Annulé');
}
function redo() {
  if (!S.redo.length) return toast('Rien à rétablir');
  S.undo.push(snapshot());
  S.tree = normalize(JSON.parse(S.redo.pop()));
  pruneSelection(); render(); toast('Rétabli');
}
function pruneSelection() {
  for (const c of [...S.sel]) if (!N(c)) S.sel.delete(c);
  if (S.selLink !== null && !S.tree.links[S.selLink]) S.selLink = null;
  if (S.linkFrom && !N(S.linkFrom)) S.linkFrom = null;
}

// ---------------------------------------------------------------- géométrie
function startNodes() { return Object.entries(S.tree.nodes).filter(([, n]) => n.start); }
/** Centre de la grille polaire : la racine la plus proche (chaque arbre a la sienne). */
function centerFor(x, y, exclude = null) {
  let best = {x: 0, y: 0}, bd = Infinity;
  for (const [c, n] of startNodes()) {
    if (exclude && exclude.has(c)) continue;
    const d = Math.hypot(n.position.x - x, n.position.y - y);
    if (d < bd) { bd = d; best = n.position; }
  }
  return best;
}
function snap(x, y, exclude = null) {
  const c = centerFor(x, y, exclude), dx = x - c.x, dy = y - c.y, r = Math.hypot(dx, dy);
  if (r < RING * 0.5) return {x: Math.round(c.x), y: Math.round(c.y)};
  const ring = Math.max(1, Math.round(r / RING)) * RING;
  const a = Math.round(Math.atan2(dy, dx) / STEP) * STEP;
  return {x: Math.round(c.x + Math.cos(a) * ring), y: Math.round(c.y + Math.sin(a) * ring)};
}
function nodeAt(x, y, tol = 14) {
  for (const [c, n] of Object.entries(S.tree.nodes))
    if (Math.hypot(n.position.x - x, n.position.y - y) <= tol) return c;
  return null;
}
/** Emplacements proposés autour d'une case : la géométrie de l'arbre rendue visible. */
function ghostSlots(code) {
  const n = N(code); if (!n) return [];
  const c = centerFor(n.position.x, n.position.y);
  const dx = n.position.x - c.x, dy = n.position.y - c.y, r = Math.hypot(dx, dy);
  const cand = [];
  if (r < 1) {
    for (let i = 0; i < 12; i++) cand.push([RING, i * Math.PI / 6]);
  } else {
    const ring = Math.round(r / RING) * RING, a = Math.atan2(dy, dx);
    for (const d of [-2, -1, 0, 1, 2]) cand.push([ring + RING, a + d * STEP]);
    for (const d of [-1, 1]) cand.push([ring, a + d * STEP]);
  }
  return cand.map(([rr, aa]) => ({x: Math.round(c.x + Math.cos(aa) * rr), y: Math.round(c.y + Math.sin(aa) * rr)}))
             .filter(p => !nodeAt(p.x, p.y, 22));
}
function wouldCycle(from, to) {
  // Ajouter from→to crée une boucle si `from` est déjà atteignable depuis `to`.
  const seen = new Set([to]), stack = [to];

    const c = stack.pop();
    if (c === from) return true;
    for (const l of outgoing(c)) if (!seen.has(l.to)) { seen.add(l.to); stack.push(l.to); }

}

// ------------------------------------------------------------- vue joueur
function loadSim() {
  try { return JSON.parse(localStorage.getItem(SIM_KEY) || '{}') || {}; } catch { return {}; }
}
function saveSim() { try { localStorage.setItem(SIM_KEY, JSON.stringify(S.sim)); } catch {} }
const simLevel = c => { const n = N(c); return n.start ? n.max_level : Math.min(S.sim[c] || 0, n.max_level); };
function prereqOk(c) {
  const ins = incoming(c).map(l => l.from).filter(N);
  if (!ins.length) return true;
  const maxed = ins.map(p => simLevel(p) >= N(p).max_level);
  return N(c).unlock_rule === 'any' ? maxed.some(Boolean) : maxed.every(Boolean);
}
function nodeState(c) {
  const n = N(c), lv = simLevel(c);
  if (lv >= n.max_level) return 'maxed';
  if (lv > 0) return 'progress';
  return prereqOk(c) ? 'available' : 'locked';
}
function spentPoints() {
  let total = 0;
  for (const [c, n] of Object.entries(S.tree.nodes)) {
    if (n.start) continue;
    const lv = simLevel(c);
    for (let i = 0; i < lv; i++) total += Number(n.costs[i] || 0);
  }
  return total;
}
function invest(c) {
  const st = nodeState(c);
  if (st === 'maxed') return toast('Déjà au maximum');
  if (st === 'locked') return toast('Verrouillée — monte d\'abord les cases reliées au maximum', true);
  S.sim[c] = (S.sim[c] || 0) + 1; saveSim(); render();
}
function refund(c) {
  const n = N(c);
  if (n.start) return toast('Une case de départ est acquise d\'office', true);
  if (!(S.sim[c] > 0)) return;
  S.sim[c] -= 1;
  // Retirer un niveau ne doit casser aucune case déjà investie plus loin.
  const broken = Object.keys(S.sim).find(k => N(k) && S.sim[k] > 0 && !N(k).start && !prereqOk(k));
  if (broken) { S.sim[c] += 1; return toast(`« ${N(broken).name || broken} » dépend de cette case`, true); }
  if (!S.sim[c]) delete S.sim[c];

}
function buildSummary() {
  const num = {}, codes = {};
  for (const [c, n] of Object.entries(S.tree.nodes)) {
    const lv = simLevel(c); if (!lv) continue;
    for (const e of n.effects) {
      const v = e.values[Math.min(lv, e.values.length) - 1];
      if (CODE_EFFECTS.has(e.type)) { if (v) (codes[e.type] ||= []).push(v); }
      else num[e.type] = (num[e.type] || 0) + (parseFloat(v) || 0);
    }

}

const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
function poly(sides, r, rot) {
  return [...Array(sides)].map((_, i) => {
    const a = rot + i * 2 * Math.PI / sides;
    return `${(Math.cos(a) * r).toFixed(1)},${(Math.sin(a) * r).toFixed(1)}`;
  }).join(' ');
}
function shapeMarkup(geom, size, attrs) {
  if (geom === 'square') { const s = size * 0.9; return `<rect x="${-s}" y="${-s}" width="${2 * s}" height="${2 * s}" rx="${(s * .22).toFixed(1)}" ${attrs}/>`; }
  if (geom === 'hexagon') return `<polygon points="${poly(6, size * 1.08, Math.PI / 6)}" ${attrs}/>`;
  if (geom === 'diamond') return `<polygon points="${poly(4, size * 1.2, -Math.PI / 2)}" ${attrs}/>`;
  if (geom === 'octagon') return `<polygon points="${poly(8, size * 1.05, Math.PI / 8)}" ${attrs}/>`;

}
const shapeOf = n => S.tree.shapes[n.shape] || {geometry: 'circle', size: 20};

const linkType = l => S.tree.link_types[l.type] || {style: 'solid', width: 3};

/** Dézoomé, noms et badges garderaient leur taille « monde » et deviendraient

function uiScale() { return Math.round(Math.min(1.75, Math.max(1, .82 / S.view.k)) * 20) / 20; }

function drawScene() {
  const nodes = Object.entries(S.tree.nodes);
  const U = S.drawnU = uiScale();
  const player = S.mode === 'player';

  // --- Fond : une nébuleuse qui épouse la forme de l'arbre ------------
  let bg = '';
  // Anneaux de la grille, autour de chaque racine, jusqu'au bord de SON arbre.
  for (const [rc, root] of startNodes()) {
    let reach = 2;
    for (const [, n] of nodes) {
      if (centerFor(n.position.x, n.position.y) !== root.position) continue;
      reach = Math.max(reach, Math.ceil(Math.hypot(n.position.x - root.position.x, n.position.y - root.position.y) / RING) + 1);
    }
    for (let i = 1; i <= reach; i++)
      bg += `<circle cx="${root.position.x}" cy="${root.position.y}" r="${i * RING}" fill="none" stroke="#2a2340" stroke-width="1"/>`;
    if (!player)
      for (let i = 0; i < 24; i++) {
        const a = i * STEP, R = reach * RING;
        bg += `<line x1="${root.position.x}" y1="${root.position.y}" x2="${(root.position.x + Math.cos(a) * R).toFixed(0)}" y2="${(root.position.y + Math.sin(a) * R).toFixed(0)}" stroke="#1c1730" stroke-width="1"/>`;
      }
  }
  let neb = '';
  for (const l of S.tree.links) {
    const a = N(l.from).position, b = N(l.to).position;
    neb += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${typeOf(N(l.to)).color}" stroke-width="60" stroke-opacity=".10" stroke-linecap="round"/>`;
  }
  for (const [c, n] of nodes) {
    const col = player ? STATE_COLORS[nodeState(c)] : typeOf(n).color;
    neb += `<circle cx="${n.position.x}" cy="${n.position.y}" r="${n.start ? 150 : 95}" fill="${col}" fill-opacity="${n.start ? .26 : .16}"/>`;
  }
  $('g-bg').innerHTML = `<g filter="url(#f-neb)">${neb}</g>${bg}`;

  // --- Liens ---------------------------------------------------------
  let lk = '';
  S.tree.links.forEach((l, i) => {
    const a = N(l.from).position, b = N(l.to).position, lt = linkType(l);
    const hot = i === S.hoverLink || i === S.hotLink || i === S.selLink;
    const doomed = S.tool === 'delete' && !player && (i === S.hoverLink || S.hoverNode === l.from || S.hoverNode === l.to);
    let col = lt.color || '#6c5f92', w = Number(lt.width || 3);
    if (player) {
      const sa = nodeState(l.from) === 'maxed', sb = nodeState(l.to);
      col = sa ? (sb === 'maxed' || sb === 'progress' ? '#f0c45c' : '#4aa3ff') : '#352d4a';
    }
    if (hot) col = '#ffd166';
    if (doomed) col = '#ff5d73';
    const dash = lt.style === 'dashed' ? 'stroke-dasharray="9 7"' : lt.style === 'dotted' ? 'stroke-dasharray="2 6" stroke-linecap="round"' : '';
    lk += `<g data-link="${i}">`;
    if (hot || doomed) lk += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${col}" stroke-width="${w + 8}" stroke-opacity=".35" filter="url(#f-glow)"/>`;
    lk += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${col}" stroke-width="${hot ? w + 2 : w}" ${dash}/>`;
    if (!player) {
      // Flèche de sens au milieu : un lien est un prérequis, il va quelque part.
      const mx = a.x + (b.x - a.x) * .55, my = a.y + (b.y - a.y) * .55, ang = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
      lk += `<path d="M -6 -5 L 5 0 L -6 5 z" fill="${col}" transform="translate(${mx.toFixed(1)},${my.toFixed(1)}) rotate(${ang.toFixed(1)})"/>`;
    }
    lk += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="transparent" stroke-width="16"/></g>`;
  });
  $('g-links').innerHTML = lk;

  // --- Cases ---------------------------------------------------------
  let nd = '';
  for (const [c, n] of nodes) {
    const sh = shapeOf(n), size = Number(sh.size || 20), color = typeOf(n).color;
    const st = player ? nodeState(c) : '';
    const selected = !player && S.sel.has(c), linking = S.linkFrom === c;
    const doomed = S.tool === 'delete' && !player && S.hoverNode === c;
    let fill = color, stroke = '#00000066', sw = 1.2, ico = 1;
    if (player) {
      if (st === 'locked') { fill = '#3a3446'; ico = .4; }

    }

    nd += `<g data-node="${esc(c)}" class="${player ? 'st-' + st : ''}" transform="translate(${n.position.x},${n.position.y})">`;
    if (player && st === 'maxed') nd += shapeMarkup(sh.geometry, size + 6, `fill="#f0c45c" fill-opacity=".45" filter="url(#f-glow)"`);
    if (selected || linking) nd += shapeMarkup(sh.geometry, size + 9, `fill="none" stroke="${linking ? '#ffd166' : '#ffffff'}" stroke-opacity=".35" stroke-width="6"`);

          + `<text class="n-badge" text-anchor="middle" dominant-baseline="central" y="${size}" font-size="${(9.5 * U).toFixed(1)}">${lv}/${n.max_level}</text>`;
    }
    nd += `<text class="n-lbl" text-anchor="middle" dominant-baseline="hanging" font-size="${(11 * U).toFixed(1)}" y="${(size + (badge ? 7 * U + 3 : 5)).toFixed(1)}"${player && st === 'locked' ? ' opacity=".55"' : ''}>${esc(n.name || c)}</text>`;
    nd += `</g>`;
  }
  $('g-nodes').innerHTML = nd;
  drawOverlay();
}

function drawOverlay() {

      o += `<circle data-ghost="${p.x},${p.y}" cx="${p.x}" cy="${p.y}" r="15" fill="#ffffff" fill-opacity=".06" stroke="#bfb2ff" stroke-opacity=".7" stroke-width="1.5" stroke-dasharray="4 4"/>`;

    o += `<line x1="${a.x}" y1="${a.y}" x2="${S.cursor.x}" y2="${S.cursor.y}" stroke="#ffd166" stroke-width="2.5" stroke-dasharray="7 6" pointer-events="none"/>`;

// =====================================================================
//  Actions d'édition
// =====================================================================
function freshCode(base) {
  base = String(base || 'case').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '') || 'case';
  let i = 1, c;
  do { c = `${base}_${i++}`; } while (S.tree.nodes[c]);
  return c;
}
function addNode(pos, parent) {
  if (nodeAt(pos.x, pos.y, 18)) return toast('Emplacement déjà occupé', true);
  const code = freshCode(S.ntype);
  mutate(() => {
    S.tree.nodes[code] = {
      name: (S.tree.node_types[S.ntype] || {}).label || 'Nouvelle case', description: '', icon: '',
      shape: S.shape, node_type: S.ntype, start: S.ntype === 'depart', unlock_rule: 'all',
      max_level: 1, costs: [S.ntype === 'depart' ? 0 : 1], effects: [], position: pos,
    };
    if (parent && N(parent)) S.tree.links.push({from: parent, to: code, type: S.ltype});
    S.sel = new Set([code]); S.selLink = null;
  });
}
function addLink(from, to) {
  if (from === to) return false;
  if (S.tree.links.some(l => (l.from === from && l.to === to) || (l.from === to && l.to === from))) { toast('Ces deux cases sont déjà reliées', true); return false; }
  if (wouldCycle(from, to)) { toast('Refusé : ce lien créerait une boucle', true); return false; }
  mutate(() => { S.tree.links.push({from, to, type: S.ltype}); });
  return true;
}
function deleteNodes(codes) {
  if (!codes.length) return;
  mutate(() => {
    for (const c of codes) { delete S.tree.nodes[c]; delete S.sim[c]; }
    S.tree.links = S.tree.links.filter(l => S.tree.nodes[l.from] && S.tree.nodes[l.to]);
    S.sel = new Set(); S.selLink = null; S.hoverNode = null;
  });
  saveSim();
  toast(codes.length > 1 ? `${codes.length} cases supprimées` : 'Case supprimée');
}
function renameNode(old, nu) {
  if (nu === old) return;
  if (!/^[a-z0-9_]+$/.test(nu)) { toast('Code : minuscules, chiffres et _ uniquement', true); return renderInspector(); }
  if (S.tree.nodes[nu]) { toast('Ce code existe déjà', true); return renderInspector(); }
  mutate(() => {
    const t = S.tree, out = {};
    for (const [c, n] of Object.entries(t.nodes)) out[c === old ? nu : c] = n;   // garde l'ordre
    t.nodes = out;
    t.links.forEach(l => { if (l.from === old) l.from = nu; if (l.to === old) l.to = nu; });
    if (S.sim[old] !== undefined) { S.sim[nu] = S.sim[old]; delete S.sim[old]; saveSim(); }
    S.sel = new Set([nu]);
  });
}
function duplicateSelection() {
  const codes = [...S.sel]; if (!codes.length) return toast('Rien à dupliquer', true);
  const map = {};
  mutate(() => {
    for (const c of codes) {
      const n = JSON.parse(JSON.stringify(N(c))), nc = freshCode(c.replace(/_\d+$/, ''));
      n.position = {x: n.position.x + 40, y: n.position.y + 40}; n.start = false;
      S.tree.nodes[nc] = n; map[c] = nc;
    }
    for (const l of [...S.tree.links]) if (map[l.from] && map[l.to]) S.tree.links.push({from: map[l.from], to: map[l.to], type: l.type});
    S.sel = new Set(Object.values(map));
  });
  toast(`${codes.length} case(s) dupliquée(s)`);
}
function focusNode(code) {
  if (!N(code)) return;
  S.sel = new Set([code]); S.selLink = null;
  const r = svg.getBoundingClientRect(), p = N(code).position;
  S.view.x = r.width / 2 - p.x * S.view.k; S.view.y = r.height / 2 - p.y * S.view.k;
  applyView(); render();
}

// ------------------------------------------------------------------ problèmes
function problems() {
  const out = [], t = S.tree, nodes = t.nodes;
  if (!t.roots.length) out.push({text: 'Aucune case de départ : personne ne pourrait commencer'});
  const linkedTo = new Set(t.links.map(l => l.to));
  for (const [c, n] of Object.entries(nodes)) {
    if (!n.start && !linkedTo.has(c)) out.push({code: c, text: `« ${n.name || c} » n'est relié à rien`});
    if (!n.icon) out.push({code: c, warn: true, text: `« ${n.name || c} » n'a pas d'icône`});
    for (const e of n.effects) if (CODE_EFFECTS.has(e.type) && !e.values[0]) out.push({code: c, text: `« ${n.name || c} » : ${(EFFECT[e.type] || {}).label} sans code`});
  }
  const pos = Object.entries(nodes);
  for (let i = 0; i < pos.length; i++) for (let j = i + 1; j < pos.length; j++)
    if (Math.hypot(pos[i][1].position.x - pos[j][1].position.x, pos[i][1].position.y - pos[j][1].position.y) < 24)
      out.push({code: pos[j][0], warn: true, text: `« ${pos[i][1].name}» et « ${pos[j][1].name} » se chevauchent`});
  return out.slice(0, 14);
}

// =====================================================================
//  Interactions canevas
// =====================================================================
const toWorld = ev => { const r = svg.getBoundingClientRect(); return {x: (ev.clientX - r.left - S.view.x) / S.view.k, y: (ev.clientY - r.top - S.view.y) / S.view.k}; };
const hit = ev => {
  const g = ev.target.closest('[data-node]'), l = ev.target.closest('[data-link]'), gh = ev.target.closest('[data-ghost]');
  return {node: g ? g.dataset.node : null, link: l ? +l.dataset.link : null, ghost: gh ? gh.dataset.ghost : null};
};

svg.addEventListener('mousedown', ev => {
  if (ev.button === 2) return;
  const w = toWorld(ev), h = hit(ev);
  closeTip();
  // Pan : clic molette, espace, ou glisser le fond en vue joueur.
  if (ev.button === 1 || S.space || (S.mode === 'player' && !h.node)) {
    S.drag = {kind: 'pan', sx: ev.clientX, sy: ev.clientY, ox: S.view.x, oy: S.view.y}; ev.preventDefault(); return;
  }
  if (S.mode === 'player') { if (h.node) invest(h.node); return; }

  if (S.tool === 'delete') {
    if (h.node) return deleteNodes([h.node]);
    if (h.link !== null) { mutate(() => { S.tree.links.splice(h.link, 1); S.hoverLink = null; }); return toast('Lien supprimé'); }
    S.drag = {kind: 'box', x0: w.x, y0: w.y, x1: w.x, y1: w.y}; return;
  }
  if (S.tool === 'link') {
    if (!h.node) { S.linkFrom = null; drawScene(); return; }
    if (!S.linkFrom) { S.linkFrom = h.node; drawScene(); return; }
    if (addLink(S.linkFrom, h.node)) toast('Lien créé');
    // Maj : on enchaîne depuis la cible pour tracer une branche d'un trait.
    S.linkFrom = ev.shiftKey ? h.node : null; drawScene(); return;
  }
  if (S.tool === 'place') {
    if (h.ghost) { const [x, y] = h.ghost.split(',').map(Number); return addNode({x, y}, [...S.sel][0]); }
    if (h.node) { S.sel = new Set([h.node]); S.selLink = null; render(); return; }
    const pos = ev.altKey ? {x: Math.round(w.x), y: Math.round(w.y)} : snap(w.x, w.y);
    return addNode(pos, S.sel.size === 1 ? [...S.sel][0] : null);
  }
  // Sélection
  if (h.node) {
    if (ev.shiftKey) { S.sel.has(h.node) ? S.sel.delete(h.node) : S.sel.add(h.node); S.selLink = null; render(); return; }
    if (!S.sel.has(h.node)) { S.sel = new Set([h.node]); S.selLink = null; }
    S.drag = {kind: 'move', before: snapshot(), w0: w, start: Object.fromEntries([...S.sel].map(c => [c, {...N(c).position}])), moved: false, anchor: h.node};
    render(); return;
  }
  if (h.link !== null) { S.sel = new Set(); S.selLink = h.link; render(); return; }
  if (!ev.shiftKey) { S.sel = new Set(); S.selLink = null; }
  S.drag = {kind: 'box', x0: w.x, y0: w.y, x1: w.x, y1: w.y, add: ev.shiftKey}; render();
});

window.addEventListener('mousemove', ev => {
  const d = S.drag;
  if (d && d.kind === 'pan') { S.view.x = d.ox + ev.clientX - d.sx; S.view.y = d.oy + ev.clientY - d.sy; applyView(); return; }
  if (!svg.contains(ev.target) && !d) return;
  const w = toWorld(ev);
  S.cursor = w;
  if (d && d.kind === 'move') {
    const dx = w.x - d.w0.x, dy = w.y - d.w0.y;
    if (Math.hypot(dx, dy) * S.view.k > 3) d.moved = true;
    if (!d.moved) return;
    // On aimante l'ANCRE ; le reste du groupe suit au même décalage. Les
    // racines déplacées ne servent pas de centre (elles bougent avec nous).
    // Si le groupe emporte sa propre racine, c'est un arbre entier qu'on
    // déplace : on le translate sur une grille de 10 px sans le déformer.
    const a = d.start[d.anchor], moving = new Set(Object.keys(d.start));
    let ox = dx, oy = dy;
    if (!ev.altKey) {
      if ([...moving].some(c => N(c).start)) { ox = Math.round(dx / 10) * 10; oy = Math.round(dy / 10) * 10; }
      else { const t = snap(a.x + dx, a.y + dy, moving); ox = t.x - a.x; oy = t.y - a.y; }
    }
    ox = Math.round(ox); oy = Math.round(oy);
    for (const [c, p] of Object.entries(d.start)) N(c).position = {x: p.x + ox, y: p.y + oy};
    drawScene(); setStatus(); return;
  }
  if (d && d.kind === 'box') { d.x1 = w.x; d.y1 = w.y; drawOverlay(); return; }
  const h = hit(ev);
  if (h.node !== S.hoverNode || h.link !== S.hoverLink) {
    S.hoverNode = h.node; S.hoverLink = h.node ? null : h.link;
    drawScene();
    if (S.mode === 'player') renderInspector();
  } else if (S.linkFrom) drawOverlay();
  showTip(ev, h.node);
  setStatus();
});

window.addEventListener('mouseup', () => {
  const d = S.drag; S.drag = null;
  if (!d) return;
  if (d.kind === 'move' && d.moved) {
    S.undo.push(d.before); S.redo = []; render();
  } else if (d.kind === 'box') {
    const x0 = Math.min(d.x0, d.x1), x1 = Math.max(d.x0, d.x1), y0 = Math.min(d.y0, d.y1), y1 = Math.max(d.y0, d.y1);
    const inside = Object.entries(S.tree.nodes).filter(([, n]) => n.position.x >= x0 && n.position.x <= x1 && n.position.y >= y0 && n.position.y <= y1).map(([c]) => c);
    if (S.tool === 'delete') { if (inside.length) deleteNodes(inside); else drawOverlay(); return; }
    if (!d.add) S.sel = new Set();
    inside.forEach(c => S.sel.add(c));
    render();
  }
});

svg.addEventListener('contextmenu', ev => {
  ev.preventDefault();
  const h = hit(ev);
  if (S.mode === 'player' && h.node) refund(h.node);
});
svg.addEventListener('mouseleave', () => { S.hoverNode = null; S.hoverLink = null; closeTip(); drawScene(); });
svg.addEventListener('wheel', ev => { ev.preventDefault(); zoomAt(ev.deltaY < 0 ? 1.12 : 1 / 1.12, ev.clientX, ev.clientY); }, {passive: false});

function zoomAt(f, cx, cy) {
  const r = svg.getBoundingClientRect();
  if (cx === undefined) { cx = r.left + r.width / 2; cy = r.top + r.height / 2; }
  const k = Math.min(3, Math.max(.15, S.view.k * f)), px = cx - r.left, py = cy - r.top;
  S.view.x = px - (px - S.view.x) * (k / S.view.k); S.view.y = py - (py - S.view.y) * (k / S.view.k); S.view.k = k;
  applyView();
}
function fitView() {
  const ns = Object.values(S.tree.nodes), r = svg.getBoundingClientRect();
  if (!ns.length || !r.width) { S.view = {x: r.width / 2, y: r.height / 2, k: 1}; return applyView(); }
  const xs = ns.map(n => n.position.x), ys = ns.map(n => n.position.y);
  // Marges : légende et toasts en haut, barre d'état en bas.
  const minX = Math.min(...xs) - 90, maxX = Math.max(...xs) + 90, minY = Math.min(...ys) - 120, maxY = Math.max(...ys) + 130;
  S.view.k = Math.min(1.6, Math.min(r.width / (maxX - minX), r.height / (maxY - minY)));
  S.view.x = r.width / 2 - (minX + maxX) / 2 * S.view.k; S.view.y = r.height / 2 - (minY + maxY) / 2 * S.view.k;
  applyView();
}

// --------------------------------------------------------------- info-bulle
function showTip(ev, code) {
  const tip = $('tip');
  if (!code || S.drag) return closeTip();
  tip.innerHTML = nodeInfoHtml(code, false);
  const r = stage.getBoundingClientRect();
  let x = ev.clientX - r.left + 16, y = ev.clientY - r.top + 16;
  tip.style.display = 'block';
  if (x + tip.offsetWidth > r.width - 8) x = ev.clientX - r.left - tip.offsetWidth - 14;
  if (y + tip.offsetHeight > r.height - 8) y = ev.clientY - r.top - tip.offsetHeight - 14;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
function closeTip() { $('tip').style.display = 'none'; }

// ---------------------------------------------------------------- statut
const HINTS = {
  place: 'Clique pour poser · un <b>emplacement proposé</b> prolonge la case sélectionnée · <kbd>Alt</kbd> place librement',
  select: 'Clic · <kbd>Maj</kbd>+clic ajoute · glisse le fond pour un rectangle · glisse une case pour déplacer',
  link: 'Clique la source puis la cible · <kbd>Maj</kbd> enchaîne depuis la cible · <kbd>Échap</kbd> annule',
  delete: 'Clique une case ou un lien pour l\'effacer · glisse un rectangle pour tout effacer dedans',
};
function setStatus() {
  const c = S.cursor ? ` · <span style="opacity:.7">${Math.round(S.cursor.x)}, ${Math.round(S.cursor.y)}</span>` : '';
  $('status').innerHTML = (S.mode === 'player'
    ? 'Clic : investir · <b>clic droit</b> : retirer · glisse le fond pour te déplacer'
    : HINTS[S.tool]) + ' · <kbd>Espace</kbd>+glisser : se déplacer' + c;
}

// =====================================================================
//  Modales : icônes et palettes
// =====================================================================
function openModal(html) { $('dlg').innerHTML = html; $('modal').classList.add('open'); }
function closeModal() { $('modal').classList.remove('open'); }
$('modal').addEventListener('mousedown', e => { if (e.target === $('modal')) closeModal(); });

function openIconPicker(code) {
  const cur = N(code).icon;
  // « Déjà dans l'arbre » est calculé à l'ouverture : il suit les modifications.
  const used = [...new Set(Object.values(S.tree.nodes).map(n => n.icon).filter(Boolean))];
  const groups = (used.length ? [{label: 'Déjà dans l\'arbre', icons: used}] : []).concat(ICON_GROUPS);
  const grid = () => groups.map(g =>
    `<div class="bt-igrp">${esc(g.label)}</div><div class="bt-icons">${g.icons.map(i => `<button data-ic="${esc(i)}" class="${i === cur ? 'on' : ''}" title="${esc(i)}">${esc(i)}</button>`).join('')}</div>`).join('');
  openModal(`<header><h2>Icône de « ${esc(N(code).name || code)} »</h2><button class="bt-x" id="ic-close" aria-label="Fermer">✕</button></header>
    <div class="body"><div class="bt-row" style="margin-bottom:6px">
      <input class="bt-in" id="ic-free" placeholder="…ou colle n'importe quel emoji" value="${esc(cur)}">
      <button class="bt-btn" id="ic-apply" style="flex:0 0 auto">Appliquer</button>
      <button class="bt-btn" id="ic-none" style="flex:0 0 auto">Aucune</button></div>
      <div id="ic-grid">${grid()}</div></div>`);
  const set = v => { mutate(() => { N(code).icon = v; }); closeModal(); };
  $('ic-close').onclick = closeModal;
  $('ic-none').onclick = () => set('');
  $('ic-apply').onclick = () => set($('ic-free').value.trim());
  $('ic-grid').addEventListener('click', e => { const b = e.target.closest('[data-ic]'); if (b) set(b.dataset.ic); });
}

function openPalettes() {
  const t = S.tree;
  const used = (key, code) => Object.values(t.nodes).filter(n => n[key] === code).length;
  const usedLinks = code => t.links.filter(l => l.type === code).length;
  const geomOpts = cur => Object.entries(GEOMETRIES).map(([g, l]) => `<option value="${g}"${g === cur ? ' selected' : ''}>${l}</option>`).join('');
  const styleOpts = cur => Object.entries(LINK_STYLES).map(([g, l]) => `<option value="${g}"${g === cur ? ' selected' : ''}>${l}</option>`).join('');
  openModal(`<header><h2>Formes, types et liens</h2><button class="bt-x" id="pl-close" aria-label="Fermer">✕</button></header>
    <div class="body">
      <p class="bt-hint">La forme est purement visuelle. Le <b>type</b> donne la couleur et le sens de la case. Une entrée utilisée ne peut pas être supprimée.</p>
      <div class="bt-igrp">Formes</div>
      <table class="bt-ptable"><tbody>${Object.entries(t.shapes).map(([c, m]) => `<tr data-pal="shapes" data-code="${esc(c)}">
        <td style="width:26px">${shapeIcon(m.geometry, '#9b6dd1', m.ring)}</td>
        <td><input data-f="label" value="${esc(m.label)}"></td><td style="width:110px"><select data-f="geometry">${geomOpts(m.geometry)}</select></td>
        <td style="width:64px"><input data-f="size" type="number" min="10" max="50" value="${m.size}"></td>
        <td style="width:70px;font-size:.74rem"><label><input data-f="ring" type="checkbox" ${m.ring ? 'checked' : ''} style="width:auto"> anneau</label></td>
        <td style="width:28px"><button class="bt-x" data-drop ${used('shape', c) ? `disabled title="Utilisée par ${used('shape', c)} case(s)"` : ''}>✕</button></td></tr>`).join('')}</tbody></table>
      <button class="bt-mini" data-add="shapes" style="margin-top:5px">+ Forme</button>
      <div class="bt-igrp">Types de case</div>
      <table class="bt-ptable"><tbody>${Object.entries(t.node_types).map(([c, m]) => `<tr data-pal="node_types" data-code="${esc(c)}">
        <td style="width:46px"><input data-f="color" type="color" value="${esc(m.color)}"></td><td><input data-f="label" value="${esc(m.label)}"></td>
        <td style="width:28px"><button class="bt-x" data-drop ${used('node_type', c) ? `disabled title="Utilisé par ${used('node_type', c)} case(s)"` : ''}>✕</button></td></tr>`).join('')}</tbody></table>
      <button class="bt-mini" data-add="node_types" style="margin-top:5px">+ Type</button>
      <div class="bt-igrp">Types de lien</div>
      <table class="bt-ptable"><tbody>${Object.entries(t.link_types).map(([c, m]) => `<tr data-pal="link_types" data-code="${esc(c)}">
        <td style="width:46px"><input data-f="color" type="color" value="${esc(m.color || '#6c5f92')}"></td><td><input data-f="label" value="${esc(m.label)}"></td>
        <td style="width:96px"><select data-f="style">${styleOpts(m.style)}</select></td><td style="width:60px"><input data-f="width" type="number" min="1" max="10" value="${m.width}"></td>
        <td style="width:28px"><button class="bt-x" data-drop ${usedLinks(c) ? `disabled title="Utilisé par ${usedLinks(c)} lien(s)"` : ''}>✕</button></td></tr>`).join('')}</tbody></table>
      <button class="bt-mini" data-add="link_types" style="margin-top:5px">+ Type de lien</button>
    </div>`);
  $('pl-close').onclick = closeModal;
  const dlg = $('dlg');
  dlg.querySelectorAll('tr[data-pal] [data-f]').forEach(el => el.addEventListener('change', () => {
    const tr = el.closest('tr'), pal = tr.dataset.pal, code = tr.dataset.code, f = el.dataset.f;
    let v = el.type === 'checkbox' ? el.checked : el.value;
    if (f === 'size' || f === 'width') v = Math.max(1, parseInt(v, 10) || 1);
    mutate(() => { S.tree[pal][code][f] = v; }, {inspector: true});
    openPalettes();
  }));
  dlg.querySelectorAll('[data-drop]').forEach(b => b.addEventListener('click', () => {
    const tr = b.closest('tr'); mutate(() => { delete S.tree[tr.dataset.pal][tr.dataset.code]; });
    fixPicks(); openPalettes();
  }));
  dlg.querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', () => {
    const pal = b.dataset.add, base = {shapes: 'forme', node_types: 'type', link_types: 'lien'}[pal];
    let i = 1; while (S.tree[pal][`${base}_${i}`]) i++;
    const entry = pal === 'shapes' ? {label: 'Nouvelle forme', geometry: 'circle', size: 22}
      : pal === 'node_types' ? {label: 'Nouveau type', color: '#8fa3ff'} : {label: 'Nouveau lien', style: 'solid', width: 3, color: '#6c5f92'};
    mutate(() => { S.tree[pal][`${base}_${i}`] = entry; });
    openPalettes();
  }));
}
function fixPicks() {
  if (!S.tree.shapes[S.shape]) S.shape = Object.keys(S.tree.shapes)[0];
  if (!S.tree.node_types[S.ntype]) S.ntype = Object.keys(S.tree.node_types)[0];
  if (!S.tree.link_types[S.ltype]) S.ltype = Object.keys(S.tree.link_types)[0];
}

// =====================================================================
//  Barre d'outils, sauvegarde, plein écran
// =====================================================================
function renderToolbar() {
  document.querySelectorAll('[data-tool]').forEach(b => b.classList.toggle('on', b.dataset.tool === S.tool));
  document.querySelectorAll('[data-mode]').forEach(b => { b.classList.toggle('on', b.dataset.mode === S.mode); b.setAttribute('aria-checked', b.dataset.mode === S.mode); });
  $('tools-edit').style.display = S.mode === 'edit' ? 'contents' : 'none';
  $('b-palettes').style.display = S.mode === 'edit' ? '' : 'none';
  $('legend').style.display = S.mode === 'player' ? 'flex' : 'none';
  $('b-undo').disabled = !S.undo.length; $('b-redo').disabled = !S.redo.length;
  $('b-undo').title = `Annuler (Ctrl+Z) — ${S.undo.length} étape(s)`; $('b-redo').title = `Rétablir (Ctrl+Y) — ${S.redo.length} étape(s)`;
  const dirty = snapshot() !== S.saved, el = $('dirty');
  el.className = 'bt-dirty' + (dirty ? '' : ' clean');
  el.textContent = dirty ? '● non enregistré' : '✓ enregistré';
  stage.dataset.tool = S.tool; stage.dataset.mode = S.mode;
  setStatus();
  layout();   // la barre peut changer de hauteur (retour à la ligne)
}
function render({inspector = true} = {}) { drawScene(); renderSide(); if (inspector) renderInspector(); renderToolbar(); }

function setTool(t) { S.tool = t; S.linkFrom = null; S.drag = null; render(); }
function setMode(m) { S.mode = m; S.linkFrom = null; S.hoverNode = null; S.drag = null; closeTip(); render(); }

let toastTimer;
function toast(msg, bad = false) {
  const t = $('toast'); t.textContent = msg; t.className = 'bt-toast show' + (bad ? ' bad' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.className = 'bt-toast'; }, 2300);
}

async function save() {
  const blocking = problems().filter(p => !p.warn);
  if (blocking.length) { toast(`${blocking.length} problème(s) à corriger avant d'enregistrer`, true); return renderSide(); }
  $('b-save').disabled = true;
  try {
    const res = await fetch('/admin/skill-tree/builder/save', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: snapshot()});
    const data = await res.json().catch(() => ({ok: false, error: 'réponse illisible'}));
    if (!data.ok) return toast('❌ ' + (data.error || 'échec'), true);
    S.saved = snapshot(); renderToolbar();
    toast(`✅ ${data.nodes} cases et ${data.links} liens enregistrés — redémarre le bot pour l'appliquer`);
  } catch (e) { toast('❌ Serveur injoignable', true); }
  finally { $('b-save').disabled = false; }
}
async function reload() {
  if (snapshot() !== S.saved && !confirm('Abandonner les modifications non enregistrées ?')) return;
  const res = await fetch('/admin/skill-tree/builder/data');
  S.tree = normalize(await res.json()); S.saved = snapshot(); S.undo = []; S.redo = [];
  S.sel = new Set(); S.selLink = null; S.linkFrom = null; fixPicks(); render(); fitView(); toast('Rechargé depuis le disque');
}

function layout() {
  const root = $('bt-root'), main = $('bt-main');
  const top = main.getBoundingClientRect().top + window.scrollY;
  const h = document.fullscreenElement === root
    ? window.innerHeight - main.getBoundingClientRect().top - 12
    : Math.max(560, window.innerHeight - top - 14);
  if (main.style.height !== h + 'px') main.style.height = h + 'px';
}
function toggleFull() {
  const root = $('bt-root');
  if (document.fullscreenElement) document.exitFullscreen();
  else root.requestFullscreen?.().catch(() => toast('Plein écran refusé par le navigateur', true));
}
document.addEventListener('fullscreenchange', () => {
  $('b-full').textContent = document.fullscreenElement ? '⛶ Quitter le plein écran' : '⛶ Plein écran';
  setTimeout(() => { layout(); fitView(); }, 60);
});
window.addEventListener('resize', layout);
window.addEventListener('beforeunload', e => { if (snapshot() !== S.saved) { e.preventDefault(); e.returnValue = ''; } });

// ------------------------------------------------------------------- liaisons
document.querySelectorAll('[data-tool]').forEach(b => b.onclick = () => setTool(b.dataset.tool));
document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => setMode(b.dataset.mode));
$('b-undo').onclick = undo; $('b-redo').onclick = redo; $('b-save').onclick = save; $('b-reload').onclick = reload;
$('b-full').onclick = toggleFull; $('b-palettes').onclick = openPalettes;
$('z-in').onclick = () => zoomAt(1.2); $('z-out').onclick = () => zoomAt(1 / 1.2); $('z-fit').onclick = fitView;
$('side').addEventListener('click', e => {
  const p = e.target.closest('[data-pick]');
  if (p) { S[{shape: 'shape', ntype: 'ntype', ltype: 'ltype'}[p.dataset.pick]] = p.dataset.code; renderSide(); return; }
  const f = e.target.closest('[data-focus]');
  if (f && f.dataset.focus) focusNode(f.dataset.focus);
});

document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName);
  const mod = e.ctrlKey || e.metaKey;
  if (e.key === 'Escape') { if ($('modal').classList.contains('open')) return closeModal(); S.linkFrom = null; S.sel = new Set(); S.selLink = null; render(); return; }
  if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); return save(); }
  if (typing) return;
  if (mod && !e.shiftKey && e.key.toLowerCase() === 'z') { e.preventDefault(); return undo(); }
  if (mod && (e.key.toLowerCase() === 'y' || (e.shiftKey && e.key.toLowerCase() === 'z'))) { e.preventDefault(); return redo(); }
  if (mod && e.key.toLowerCase() === 'd') { e.preventDefault(); return duplicateSelection(); }
  if (mod && e.key.toLowerCase() === 'a' && S.mode === 'edit') { e.preventDefault(); S.sel = new Set(Object.keys(S.tree.nodes)); return render(); }
  if (mod) return;
  if (e.key === ' ') { S.space = true; e.preventDefault(); return; }
  if ((e.key === 'Delete' || e.key === 'Backspace') && S.mode === 'edit') {
    if (S.sel.size) return deleteNodes([...S.sel]);
    if (S.selLink !== null) { mutate(() => { S.tree.links.splice(S.selLink, 1); S.selLink = null; }); return toast('Lien supprimé'); }
  }
  const tools = {'1': 'place', '2': 'select', '3': 'link', '4': 'delete'};
  if (tools[e.key] && S.mode === 'edit') return setTool(tools[e.key]);
  if (e.key === '+' || e.key === '=') return zoomAt(1.2);
  if (e.key === '-') return zoomAt(1 / 1.2);
  if (e.key === '0') return fitView();
  if (e.key.toLowerCase() === 'f') return toggleFull();
});
document.addEventListener('keyup', e => { if (e.key === ' ') S.space = false; });

layout();
render();
fitView();
})();
</script>
