name: Tests

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]

jobs:
  pytest:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # Pas de .env sur GitHub : des valeurs factices pour les champs
      # obligatoires de Settings (les tests n'appellent jamais Discord).
      - name: Run domain tests
        env:
          DISCORD_TOKEN: ci-dummy
          DATABASE_URL: "sqlite:///:memory:"
          BETA_CHANNEL_ID: "0"
          ENCOUNTER_CHANNEL_ID: "0"
        run: pytest tests/domain -v
