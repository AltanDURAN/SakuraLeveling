name: Tests

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]

jobs:
  pytest:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Les bibliothèques système des rendus (arbre en SVG, emojis de la bannière).
      - name: Install system libraries
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libcairo2 fonts-noto-color-emoji

      # Les versions exactes de la prod (cf. « Dépendances » dans CLAUDE.md).
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install --no-deps -e .

      # Pas de .env sur GitHub : des valeurs factices pour les champs
      # obligatoires de Settings (les tests n'appellent jamais Discord).
      - name: Run tests
        env:
          DISCORD_TOKEN: ci-dummy
          DATABASE_URL: "sqlite:///:memory:"
          BETA_CHANNEL_ID: "0"
          ENCOUNTER_CHANNEL_ID: "0"
          ADMIN_SESSION_SECRET: test-secret-for-ci-only-32-characters-min
        run: pytest -q --ignore=tests/sandbox
