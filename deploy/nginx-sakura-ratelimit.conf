# Limite de requêtes du site Sakura (audit du 28/11/2026) — à copier dans
# /etc/nginx/conf.d/. Par adresse IP : connexion Discord 10 par minute,
# API et envois d'images 60 par minute (rafales tolérées). Au-delà : 429.
limit_req_zone $binary_remote_addr zone=sakura_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=sakura_api:10m rate=60r/m;
limit_req_status 429;
